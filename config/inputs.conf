# Splunk Universal Forwarder - inputs.conf
# Location on Windows endpoint: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
#
# Configures which Windows Event Log channels are monitored and forwarded
# to the Splunk indexer.

[WinEventLog://Application]
disabled = 0

[WinEventLog://Security]
disabled = 0

[WinEventLog://System]
disabled = 0

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = main

[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = main
